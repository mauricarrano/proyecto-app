    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: 34 197 94; /* green-500 */
        --color-secondary: 139 92 246; /* violet-500 */
        --color-background: 15 23 42; /* slate-900 */
        --color-surface: 30 41 59; /* slate-800 */
        --color-text-primary: 241 245 249; /* slate-100 */
        --color-text-secondary: 148 163 184; /* slate-400 */
      }
      body {
        font-family: 'Poppins', sans-serif;
        background-color: rgb(var(--color-background));
        color: rgb(var(--color-text-primary));
      }
      .font-mono {
        font-family: 'Roboto Mono', monospace;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background-color: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(var(--color-text-secondary), 0.4);
        border-radius: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(var(--color-text-secondary), 0.6);
      }
    </style>
